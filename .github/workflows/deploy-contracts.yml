name: Deploy Contracts and Verify artifacts  
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Start local node
        run: |
          npm run node &
          NODE_PID=$!
          echo "Node PID: $NODE_PID"

      - name: Wait for node to be ready
        run: |
          # Example: poll until HTTP port or log indicates ready
          for i in {1..30}; do
            if curl --silent localhost:9933/health; then
              echo "Node ready"
              break
            fi
            echo "Waiting for node..."
            sleep 2
          done

      - name: Deploy contracts
        run: npm run deploy:polkadot

      - name: Verify deployment artifact exists
        run: |
          if [ ! -f deployment/420420420.json ]; then
            echo "ERROR: deployment/420420420.json not found"
            exit 1
          fi

      - name: Stop local node
        run: |
          echo "Stopping node PID $NODE_PID"
          kill $NODE_PID || true

      - name: Clean-up
        run: |
          wait $NODE_PID || true
