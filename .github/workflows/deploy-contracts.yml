name: Deploy Contracts and Verify artifacts
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Start local node
        run: |
          npm run node &
          echo $! > node.pid

      - name: Wait for node to be ready
        run: |
          for i in {1..30}; do
            if curl --silent localhost:9933/health; then
              break
            fi
            sleep 2
          done

      - name: Deploy contracts
        run: npm run deploy:polkadot:compile

      - name: Verify deployment artifact exists
        run: |
          [ -f deployment/420420420.json ] || exit 1

      - name: Stop local node
        run: |
          kill $(cat node.pid) || true
          wait $(cat node.pid) || true
